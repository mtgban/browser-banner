name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install --frozen-lockfile

      - name: bun test
        run: bun run test

  # Every guard in a site's tests/mutations.json broken in turn, each of which
  # must fail the test it names. One job per site, since each runs alone;
  # tests/repo.test.js holds this list to the sites that have guards.
  mutate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [cardmarket, cardkingdom, tcgplayer]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install --frozen-lockfile

      - name: bun run mutate
        run: bun run mutate sites/${{ matrix.site }}
